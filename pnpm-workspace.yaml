packages:
  - examples/*

catalogs:
  toolchain:
    '@types/node': ^22.9.4
    # 1.87.0 plus oxc#20501 and actualText fix, built in Norbiros/oxc
    oxlint: https://github.com/Norbiros/oxc/releases/download/esinox-poc-1/oxlint-1.87.0-esinox-poc.tgz
    typescript: 7.0.2
    # Keep Vite Plus and its core on the same version.
    vite: npm:@voidzero-dev/vite-plus-core@1.0.0
    vite-plus: 1.0.0
  publish:
    '@arethetypeswrong/core': 0.18.5
    pkg-pr-new: 0.0.91
    publint: 0.3.25
  runtime:
    '@oxlint/plugins': ^1.87.0
    eslint: ^10.12.0
  examples:
    '@typescript-eslint/parser': ^8.71.2
    eslint-plugin-vue: ^10.11.1
    # typescript-eslint does not support TypeScript 7 yet.
    typescript: ~6.0.3
  inlined: {}
overrides:
  vite@*: 'catalog:toolchain'
peerDependencyRules:
  allowAny:
    - vite
    # Installed from a tarball, which pnpm cannot match against esinoxc's semver range.
    - oxlint
