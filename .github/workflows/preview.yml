name: Preview release

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, reopened, synchronize, labeled]
    branches: [master]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    name: Publish preview
    if: |
      !github.event.repository.fork
      && (
        github.event_name == 'push'
        || contains(github.event.pull_request.labels.*.name, 'release: preview')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup toolchain
        uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version-file: .node-version
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      # pnpm pack runs prepack, which builds and validates the library with vp pack.
      - name: Publish preview
        run: vp exec pkg-pr-new publish --pnpm --no-compact --commentWithSha --no-template --packageManager=pnpm,npm .
