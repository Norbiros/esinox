name: Release

on:
  push:
    branches: [master, 'release/v*']
  pull_request:
    types: [closed]
    branches: [master]
  workflow_dispatch:
    inputs:
      npm-tag:
        description: 'npm dist-tag override; leave blank for the default'
        required: false
        default: ''

permissions: {}
cache-mode: none

jobs:
  pr:
    name: Prepare release PR
    if: |
      !github.event.repository.fork
      && github.event_name == 'push'
      && (
        github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        || startsWith(github.ref, 'refs/heads/release/v')
      )
    runs-on: ubuntu-latest
    concurrency:
      group: release-pr-${{ github.event.repository.default_branch }}
      cancel-in-progress: true
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Prepare release PR
        uses: danielroe/uppt/pr@6ec27140623aa835e362f866d8ab0018ab057f4d # v0.6.11

  release:
    name: Create release
    if: |
      github.event_name == 'pull_request'
      && github.event.pull_request.merged == true
      && startsWith(github.event.pull_request.head.ref, 'release/v')
      && github.event.pull_request.head.repo.full_name == github.repository
      && !github.event.repository.fork
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      actions: write
    steps:
      - name: Create release
        uses: danielroe/uppt/release@6ec27140623aa835e362f866d8ab0018ab057f4d # v0.6.11

  pack:
    name: Pack
    if: |
      github.event_name == 'workflow_dispatch'
      && startsWith(github.ref, 'refs/tags/v')
      && !github.event.repository.fork
    runs-on: ubuntu-latest
    concurrency:
      group: pack-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
    outputs:
      files: ${{ steps.pack.outputs.files }}
    steps:
      - name: Pack
        id: pack
        uses: danielroe/uppt/pack@6ec27140623aa835e362f866d8ab0018ab057f4d # v0.6.11

  publish:
    name: Stage npm publish
    if: |
      github.event_name == 'workflow_dispatch'
      && startsWith(github.ref, 'refs/tags/v')
      && !github.event.repository.fork
      && needs.pack.outputs.files != '[]'
    needs: pack
    runs-on: ubuntu-latest
    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      id-token: write
    environment: npm
    steps:
      - name: Stage npm publish
        uses: danielroe/uppt/publish@6ec27140623aa835e362f866d8ab0018ab057f4d # v0.6.11
        with:
          files: ${{ needs.pack.outputs.files }}
          npm-tag: ${{ inputs.npm-tag }}
